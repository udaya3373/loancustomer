name: Build Signed APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Cache Android build tools
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android.jks

      - name: Build release APK
        run: |
          docker run --rm --user root --entrypoint /bin/sh \
            --volume "$GITHUB_WORKSPACE":/home/user/hostcwd \
            --volume "$HOME/.buildozer":/home/user/.buildozer \
            --workdir /home/user/hostcwd \
            kivy/buildozer:latest -c '
              apt-get update &&
              apt-get install --yes --no-install-recommends wget &&
              if ! getent passwd user > /dev/null; then
                useradd --non-unique --uid "$(stat --format=%u /home/user/hostcwd)" \
                  --create-home --shell /bin/bash user
              fi &&
              chown --recursive user:user /home/user &&
              su user -s /bin/bash -c "
                export PATH=/home/user/.venv/bin:/home/user/.local/bin:\$PATH
                cd /home/user/hostcwd
                buildozer -v android release
              "
            '

      - name: Sign release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APK_PATH="$(find ./bin -name '*-release-unsigned.apk' -print -quit)"
          test -n "$APK_PATH"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore android.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$APK_PATH" "$KEY_ALIAS"
          mv "$APK_PATH" "${APK_PATH/-unsigned/-signed}"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: ./bin/*-release-signed.apk
          if-no-files-found: error
          retention-days: 14
